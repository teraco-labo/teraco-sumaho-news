<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パスワードとは｜世界一わかりやすいスマホニュース</title>
<meta name="description" content="本人だと確かめるための、秘密の合言葉です。">
<link rel="icon" href="../cover.jpg">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  .t { color:var(--accent); border-bottom:1px dashed currentColor; cursor:help;
    font-weight:500; }
  .t:hover, .t:focus-visible { background:rgba(14,116,144,0.10); outline:none; border-radius:2px; }
  #tip { position:absolute; z-index:60; max-width:min(22rem,88vw); padding:0.85rem 1rem;
    background:var(--card-bg); border:1px solid var(--border); border-radius:8px;
    box-shadow:0 8px 28px rgba(15,23,42,0.16); font-size:0.84rem; line-height:1.8;
    opacity:0; visibility:hidden; transition:opacity .12s; pointer-events:none; }
  #tip.on { opacity:1; visibility:visible; pointer-events:auto; }
  #tip .tip-n { font-weight:700; display:block; margin-bottom:0.3rem; }
  #tip .tip-m { display:inline-block; margin-top:0.5rem; font-size:0.78rem;
    font-weight:600; color:var(--accent); text-decoration:none; }
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:70; padding:1.4rem 1.4rem 2rem;
    background:var(--card-bg); border-top:1px solid var(--border);
    border-radius:16px 16px 0 0; box-shadow:0 -8px 32px rgba(15,23,42,0.22);
    transform:translateY(102%); transition:transform .22s ease; }
  #sheet.on { transform:translateY(0); }
  #sheet .sheet-grip { width:36px; height:4px; border-radius:2px; background:var(--border);
    margin:0 auto 1rem; }
  #sheet .tip-n { font-size:1.05rem; font-weight:700; display:block; margin-bottom:0.5rem; }
  #sheet .tip-s { font-size:0.92rem; line-height:1.95; color:var(--text-muted); }
  #sheet .tip-m { display:block; margin-top:1.1rem; padding:0.75rem; text-align:center;
    background:var(--accent); color:#fff; border-radius:8px; font-size:0.88rem;
    font-weight:700; text-decoration:none; }
  #veil { position:fixed; inset:0; z-index:69; background:rgba(15,23,42,0.35);
    opacity:0; visibility:hidden; transition:opacity .22s; }
  #veil.on { opacity:1; visibility:visible; }
  @media (prefers-reduced-motion:reduce){ #sheet,#veil,#tip{transition:none} }

  :root { --bg:#F6F4EE; --card:#fff; --ink:#22251F; --ink2:#55594F; --line:#E2DED2;
          --green:#1E4D3B; --head:#1E4D3B; --orange:#E8792B; --orange-soft:#FCEBDC;
          --accent:#A9481A; --card-bg:#fff; --border:#E2DED2; --text:#22251F; --text-muted:#55594F; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141915; --card:#1E2420;
          --ink:#ECEDE8; --ink2:#B5B9AE; --line:#333A34; --green:#8CC7A6; --orange-soft:#3A2A1C;
          --accent:#F3A56F; --card-bg:#1E2420; --border:#333A34; --text:#ECEDE8; --text-muted:#B5B9AE; color-scheme:dark; } }
  :root[data-theme="dark"] { --bg:#141915; --card:#1E2420; --ink:#ECEDE8; --ink2:#B5B9AE; --line:#333A34;
          --green:#8CC7A6; --orange-soft:#3A2A1C; --accent:#F3A56F; --card-bg:#1E2420; --border:#333A34;
          --text:#ECEDE8; --text-muted:#B5B9AE; color-scheme:dark; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
         font-size:19px; line-height:1.9; -webkit-text-size-adjust:100%; }
  header { background:var(--head); color:#fff; padding:20px 16px 18px; text-align:center; }
  header a { color:#fff; text-decoration:none; }
  header .sub { font-size:15px; opacity:.85; }
  header .name { font-size:24px; font-weight:700; line-height:1.3; }
  header .date { margin-top:6px; font-size:16px; }
  main { max-width:680px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:25px; line-height:1.45; text-wrap:balance; }
  .listen { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:16px; padding:15px;
            border-radius:16px; background:var(--orange); color:#fff; font-size:21px; font-weight:700; text-decoration:none; }
  .listen svg { width:26px; height:26px; }
  .hint { margin-top:14px; font-size:16px; color:var(--ink2); background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:10px 14px; }
  .hint .t { pointer-events:none; }
  h2 { margin:34px 0 8px; font-size:22px; color:var(--green); border-left:6px solid var(--orange); padding-left:10px; text-wrap:balance; }
  article p { margin:12px 0; }
  .t { font-weight:700; }
  .review { background:var(--orange-soft); border-radius:18px; padding:18px 16px; margin-top:34px; }
  .review h2 { margin:0 0 6px; border:0; padding:0; color:var(--ink); }
  .review ol { padding-left:1.4em; font-size:20px; font-weight:700; }
  .review .hw { margin-top:10px; font-size:17px; }
  .src { margin-top:28px; font-size:15px; color:var(--ink2); }
  .src ul { padding-left:1.2em; }
  .src a, .more a { color:var(--green); }
  .more { margin-top:22px; font-size:16px; display:flex; flex-wrap:wrap; gap:8px 18px; }
  .foot { margin-top:28px; text-align:center; font-size:16px; color:var(--ink2); }
  .foot a { color:var(--green); font-weight:700; }
  /* 用語の説明は、シニア向けに AIニュースより文字を大きくする */
  #tip { font-size:17px !important; line-height:1.8 !important; }
  #tip .tip-m { font-size:16px !important; }
  #sheet .tip-n { font-size:21px !important; }
  #sheet .tip-s { font-size:18px !important; color:var(--ink) !important; }
  #sheet .tip-m { font-size:18px !important; padding:14px !important; background:var(--head) !important; }
  /* 解説ページ・用語集 */
  .easy { margin-top:18px; padding:16px; background:var(--card); border:1px solid var(--line); border-left:6px solid var(--orange); border-radius:12px; }
  .lbl { display:block; font-size:14px; font-weight:700; color:var(--ink2); letter-spacing:.06em; }
  .detail { margin-top:22px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .chips a { padding:6px 14px; background:var(--card); border:1px solid var(--line); border-radius:999px;
             color:var(--ink); text-decoration:none; font-size:17px; }
  .seen { margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .seen a { color:var(--green); }
  .cat { margin-top:26px; }
  .list { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; margin-top:8px; }
  .list a { display:block; padding:12px 14px; background:var(--card); border:1px solid var(--line); border-radius:12px;
            text-decoration:none; color:var(--ink); }
  .list .n { font-weight:700; }
  .list .s { font-size:15px; color:var(--ink2); line-height:1.6; }
  :focus-visible { outline:3px solid var(--orange); outline-offset:2px; }

  .follow { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin-top:30px;
            padding:16px; border:none; border-radius:16px; background:var(--head); color:#fff;
            font-size:21px; font-weight:700; font-family:inherit; cursor:pointer; }
  .follow svg { width:26px; height:26px; }
  #fveil { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.4); display:none; }
  #fsheet { position:fixed; left:0; right:0; bottom:0; z-index:81; max-width:680px; margin:0 auto;
            background:var(--card); color:var(--ink); border-radius:18px 18px 0 0; padding:22px 18px 28px;
            box-shadow:0 -8px 30px rgba(0,0,0,.25); display:none; max-height:88vh; overflow:auto; }
  #fveil.on, #fsheet.on { display:block; }
  #fsheet h3 { font-size:22px; margin-bottom:6px; }
  #fsheet .way { margin-top:16px; padding:14px; border:1px solid var(--line); border-radius:14px; }
  #fsheet .way b { display:block; font-size:19px; }
  #fsheet .way p { font-size:17px; color:var(--ink2); margin-top:4px; line-height:1.7; }
  #fsheet .go { display:block; margin-top:10px; padding:13px; border-radius:12px; text-align:center;
                font-size:19px; font-weight:700; text-decoration:none; color:#fff; }
  #fsheet .go.line { background:#06C755; }
  #fsheet .go.spotify { background:#1DB954; }
  #fsheet .close { display:block; width:100%; margin-top:16px; padding:12px; border:1px solid var(--line);
                   border-radius:12px; background:transparent; color:var(--ink); font-size:18px; font-family:inherit; cursor:pointer; }
</style>
</head>
<body>
<header>
  <a href="../"><div class="sub">てらこ先生の</div><div class="name">世界一わかりやすい<br>スマホニュース</div></a>
  <div class="date">ことばの解説</div>
</header>
<main>
  <h1>パスワード</h1>
  <div class="easy"><span class="lbl">ひとことで言うと</span><p>本人だと確かめるための、秘密の合言葉です。</p></div>
  <div class="detail"><span class="lbl">もう少しくわしく</span><p><span class="t" data-t="app" tabindex="0" role="button" aria-label="アプリの説明を見る">アプリ</span>やサービスに入るときに使う、本人だけが知っている文字や数字の組み合わせです。人に教えない、ほかのサービスと同じにしない、が基本です。</p></div>
  <div class="detail"><span class="lbl">いっしょに知りたい言葉</span><div class="chips"><a href="nisemono-message.html">偽物のメッセージ</a></div></div>
  <div class="detail"><span class="lbl">この言葉が出てきた回</span><div class="seen"><a href="../episodes/2026-10-04/yomu.html">10月4日（日）　携帯会社を名乗る偽メッセージ、だまされない3つのコツ</a></div></div>
  <div class="more"><a href="./">用語集へ</a><a href="../">最新の回へ</a></div>
  <div class="foot">わからないことは、教室で一緒に確かめましょう。<br>
    <a href="https://lin.ee/tkYJ7Cw">スマホ教室TERACO の公式LINE</a></div>
</main>
<script type="application/json" id="glossary-data">{"app": {"n": "アプリ", "r": "", "s": "スマホに入れて使う道具。画面に並んでいる、小さな絵のボタンです。", "u": "../terms/app.html"}}</script>

<script>
(function(){
  var el = document.getElementById('glossary-data');
  if (!el) return;
  var G; try { G = JSON.parse(el.textContent); } catch(e) { return; }

  // 指でも操作する端末ではシート、マウスがある端末ではポップアップにする
  var hoverable = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  var tip = document.createElement('div'); tip.id = 'tip';
  var veil = document.createElement('div'); veil.id = 'veil';
  var sheet = document.createElement('div'); sheet.id = 'sheet';
  sheet.innerHTML = '<div class="sheet-grip"></div><span class="tip-n"></span>'
    + '<div class="tip-s"></div><a class="tip-m" href="#">くわしい解説を読む →</a>';
  document.body.appendChild(tip);
  document.body.appendChild(veil);
  document.body.appendChild(sheet);

  function showTip(node, d){
    tip.innerHTML = '<span class="tip-n"></span><span class="tip-s"></span>'
      + '<a class="tip-m" href="#">くわしい解説 →</a>';
    tip.querySelector('.tip-n').textContent = d.r ? (d.n + '（' + d.r + '）') : d.n;
    tip.querySelector('.tip-s').textContent = d.s;
    tip.querySelector('.tip-m').href = d.u;
    tip.classList.add('on');
    var r = node.getBoundingClientRect();
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.min(Math.max(8, r.left + r.width/2 - w/2), window.innerWidth - w - 8);
    var top = r.top - h - 10;
    if (top < 8) top = r.bottom + 10;           // 上に入らなければ下に出す
    tip.style.left = (left + window.scrollX) + 'px';
    tip.style.top  = (top + window.scrollY) + 'px';
  }
  function hideTip(){ tip.classList.remove('on'); }

  function openSheet(d){
    sheet.querySelector('.tip-n').textContent = d.r ? (d.n + '（' + d.r + '）') : d.n;
    sheet.querySelector('.tip-s').textContent = d.s;
    sheet.querySelector('.tip-m').href = d.u;
    sheet.classList.add('on'); veil.classList.add('on');
  }
  function closeSheet(){ sheet.classList.remove('on'); veil.classList.remove('on'); }
  veil.addEventListener('click', closeSheet);

  var hideTimer;
  document.addEventListener('mouseover', function(e){
    if (!hoverable) return;
    var n = e.target.closest('.t'); if (!n) return;
    clearTimeout(hideTimer);
    var d = G[n.getAttribute('data-t')]; if (d) showTip(n, d);
  });
  document.addEventListener('mouseout', function(e){
    if (!hoverable) return;
    if (e.target.closest('.t') && !tip.contains(e.relatedTarget)) {
      hideTimer = setTimeout(hideTip, 180);
    }
  });
  tip.addEventListener('mouseenter', function(){ clearTimeout(hideTimer); });
  tip.addEventListener('mouseleave', hideTip);

  document.addEventListener('click', function(e){
    var n = e.target.closest('.t'); if (!n) return;
    var d = G[n.getAttribute('data-t')]; if (!d) return;
    e.preventDefault();
    if (hoverable) { location.href = d.u; } else { openSheet(d); }
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') { hideTip(); closeSheet(); return; }
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var n = document.activeElement; if (!n || !n.classList.contains('t')) return;
    var d = G[n.getAttribute('data-t')]; if (!d) return;
    e.preventDefault();
    hoverable ? (location.href = d.u) : openSheet(d);
  });
})();
</script>
</body>
</html>
